# MineSkript messages, in English.
#
# Each line is key=message. {0}, {1} and so on are filled in with values, in that order: a file name, a line number,
# a piece of script. Nothing else is special; quotes and apostrophes are written as they are. Write a backslash as \\.
# Messages that belong to a single syntax element still live in that element's class.

# Reading the indentation and comments of a script
lexer.mixed-indentation=mixed tabs and spaces in indentation
lexer.unclosed-block-comment=block comment "###" is never closed
lexer.dangling-continuation=the last line ends with "\\" but nothing follows it
lexer.unexpected-indentation=unexpected indentation
lexer.empty-section=empty section

# Splitting a line into words
tokenizer.unterminated-string=unterminated string
tokenizer.unterminated-variable=unterminated variable

